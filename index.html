<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Summit Prep — Snowboard Trip Training</title>
<meta name="theme-color" content="#0F1720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="masthead">
    <div class="masthead-top">
      <div class="mark">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 20L9 9L13 15L17 8L24 20" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <button class="reset-btn" id="resetBtn" title="Reset progress">Reset</button>
    </div>
    <h1>Summit Prep</h1>
    <p class="subhead">Twenty weeks of ground work, one trip down the mountain.</p>

    <div class="countdown-row">
      <div class="countdown-field">
        <label for="tripDate">Trip date</label>
        <input type="date" id="tripDate">
      </div>
      <div class="countdown-display">
        <span id="daysLeft">—</span>
        <span class="countdown-label">days out</span>
      </div>
    </div>
  </header>

  <section class="progress-strip">
    <div class="progress-strip-top">
      <span id="phaseLabel">Phase 1 · Foundation</span>
      <span id="weekLabel">Week 1 of 20</span>
    </div>
    <div class="schedule-line" id="scheduleLine"></div>
    <div class="track">
      <div class="track-fill" id="trackFill"></div>
      <div class="track-phases">
        <span style="left:0%"></span>
        <span style="left:30%"></span>
        <span style="left:70%"></span>
        <span style="left:95%"></span>
      </div>
    </div>
    <div class="week-stepper">
      <button id="weekBack" aria-label="Previous week">‹</button>
      <input type="range" id="weekSlider" min="1" max="20" value="1" step="1">
      <button id="weekFwd" aria-label="Next week">›</button>
    </div>
  </section>

  <nav class="day-tabs" id="dayTabs"></nav>

  <main id="workoutView"></main>

  <section class="phase-note" id="phaseNote"></section>

  <footer class="foot">
    <button class="link-btn" id="viewAllBtn">See the full 20‑week plan</button>
    <button class="link-btn" id="stretchGuideBtn">Stretching guide</button>
    <div class="version" id="versionLine"></div>
  </footer>

</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="sheetTitle">Full plan</h2>
      <button class="sheet-close" id="sheetClose">Close</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="plan.js"></script>
<script src="script.js"></script>
</body>
</html>
